name: Build Free Internet v6.3.0 APK (Official Oblivion AAR + MahsaNG Xray + hev-socks5-tunnel)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compile Android APK v6.3.0 (Oblivion tun2socks.aar + Xray + hev-socks5-tunnel.aar)
    runs-on: ubuntu-latest

    steps:
      - name: "۱. دریافت سورس‌کد مخزن (Checkout)"
        uses: actions/checkout@v4

      - name: "۲. نصب جاوا ۱۷ (Set up JDK 17)"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "۳. نصب Go 1.22 برای کامپایل هسته رسمی Oblivion اندروید (tun2socks.aar)"
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: "۴. نصب سورس نسخه ۶.۳ (پلن ۲ Oblivion رسمی + پلن ۱ MahsaNG Xray)"
        run: |
          set -e
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting uploaded ZIP archive..."
            unzip -o "*.zip" || true
          fi

          rm -rf app/src/main/java/*
          rm -rf app/src/main/jniLibs/*
          rm -rf app/libs/*
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/java/com/example/smartdnsstabilizer
          mkdir -p app/src/main/res/values

          if [ -f "SmartDnsVpnApp.kt" ] && grep -q "Version: 6.3.0" "SmartDnsVpnApp.kt" 2>/dev/null; then
            cp SmartDnsVpnApp.kt app/src/main/java/com/example/smartdnsstabilizer/SmartDnsVpnApp.kt
          else
            echo "Installing embedded v6.3.0 Unified Oblivion + MahsaNG Xray Engine..."
            echo "" | base64 -d | gunzip > app/src/main/java/com/example/smartdnsstabilizer/SmartDnsVpnApp.kt
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartDnsStabilizer"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.smartdnsstabilizer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.smartdnsstabilizer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 23
                  versionName = "6.3.0"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                      signingConfig = signingConfigs.getByName("debug")
                  }
                  debug {
                      isDebuggable = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
                  jniLibs {
                      useLegacyPackaging = true
                      pickFirsts += "**/libgojni.so"
                      pickFirsts += "**/libhev-socks5-tunnel.so"
                  }
              }
          }

          dependencies {
              implementation(fileTree(mapOf("dir" to "libs", "include" to listOf("*.jar", "*.aar"))))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")
              implementation("androidx.activity:activity-compose:1.9.0")

              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keep class io.nekohasekai.libbox.** { *; }
          -keep class libv2ray.** { *; }
          -keep class hev.htproxy.** { *; }
          -keep class tun2socks.** { *; }
          -dontwarn io.nekohasekai.libbox.**
          -dontwarn libv2ray.**
          -dontwarn hev.htproxy.**
          -dontwarn tun2socks.**
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-sdk tools:overrideLibrary="hev.socks5.tunnel,hev.htproxy,go,libv2ray,tun2socks,org.bepass.oblivion" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission
                  android:name="android.permission.QUERY_ALL_PACKAGES"
                  tools:ignore="QueryAllPackagesPermission" />

              <application
                  android:allowBackup="true"
                  android:label="اینترنت آزاد v6.3.0"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SmartStabilizerVpnService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn" />
                  </service>

                  <service
                      android:name=".SmartVpnTileService"
                      android:exported="true"
                      android:icon="@android:drawable/ic_lock_lock"
                      android:label="اینترنت آزاد v6.3.0"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          EOF

      - name: "۵. تنظیم مستقیم Android SDK و NDK پیش‌فرض سرور گیت‌هاب"
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          elif [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          echo "Android SDK configured at: $SDK_DIR"

      - name: "۶. دانلود و کامپایل هسته‌های بومی (Oblivion tun2socks.aar + hev-socks5-tunnel.aar + libv2ray.aar)"
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          # 1. Place Official hev-socks5-tunnel.aar directly in app/libs/ (includes classes.jar + libhev-socks5-tunnel.so)
          HEV_AAR_URL=$(curl -sSL https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest | grep -o 'https://[^"]*\.aar' | head -n 1 || true)
          if [ -z "$HEV_AAR_URL" ]; then
            HEV_AAR_URL="https://github.com/heiher/hev-socks5-tunnel/releases/latest/download/hev-socks5-tunnel.aar"
          fi
          curl -sSL --fail -o app/libs/hev-socks5-tunnel.aar "$HEV_AAR_URL"

          # 2. Download Xray-core (libv2ray.aar)
          curl -sSL --fail -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar

          # 3. Compile Official Oblivion tun2socks.aar (bepass-org/oblivion) using gomobile
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_DIR/ndk" ]; then
            export ANDROID_NDK_HOME=$(ls -d "$SDK_DIR/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          export PATH="$PATH:$(go env GOPATH)/bin"
          echo "Building Official Oblivion tun2socks.aar with ANDROID_NDK_HOME=$ANDROID_NDK_HOME ..."
          if git clone --depth 1 https://github.com/bepass-org/oblivion.git /tmp/oblivion_src; then
            if [ -d "/tmp/oblivion_src/tun2socks" ]; then
              cd /tmp/oblivion_src/tun2socks
              go install golang.org/x/mobile/cmd/gomobile@latest || true
              go install golang.org/x/mobile/cmd/gobind@latest || true
              gomobile init || true
              go get golang.org/x/mobile/cmd/gomobile || true
              go mod tidy || true
              if gomobile bind -ldflags="-w -s" -target=android/arm64 -androidapi=21 -o=/tmp/oblivion-tun2socks.aar . ; then
                cp /tmp/oblivion-tun2socks.aar "$GITHUB_WORKSPACE/app/libs/oblivion-tun2socks.aar"
                echo "Successfully compiled Official Oblivion tun2socks.aar!"
              else
                echo "gomobile bind fallback — using Xray Native WireGuard WARP + hev-socks5-tunnel.aar"
              fi
              cd "$GITHUB_WORKSPACE"
            fi
            rm -rf /tmp/oblivion_src
          fi

          # 4. Download warp-plus standalone binary as backup in jniLibs
          WARP_ARM64_URL=$(curl -sSL https://api.github.com/repos/bepass-org/warp-plus/releases/latest | grep -o 'https://[^"]*android-arm64\.zip' | head -n 1 || true)
          if [ -z "$WARP_ARM64_URL" ]; then
            WARP_ARM64_URL="https://github.com/bepass-org/warp-plus/releases/latest/download/warp-plus_android-arm64.zip"
          fi
          if curl -sSL --fail -o /tmp/warp-plus-arm64.zip "$WARP_ARM64_URL"; then
            mkdir -p /tmp/warp_arm64
            unzip -q -o /tmp/warp-plus-arm64.zip -d /tmp/warp_arm64 || true
            WARP_BIN=$(find /tmp/warp_arm64 -type f -name "warp-plus" | head -n 1 || true)
            if [ -n "$WARP_BIN" ]; then
              cp "$WARP_BIN" app/src/main/jniLibs/arm64-v8a/libwarp_plus.so
              chmod 755 app/src/main/jniLibs/arm64-v8a/libwarp_plus.so
            fi
            rm -rf /tmp/warp-plus-arm64.zip /tmp/warp_arm64
          fi

          ls -lh app/libs/
          ls -lhR app/src/main/jniLibs/

      - name: "۷. نصب سریع Gradle 8.7 و کامپایل خروجی‌های APK (Debug & Release)"
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7.zip
          unzip -q -o /tmp/gradle-8.7.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug assembleRelease --no-daemon --console=plain

      - name: "۸. آپلود خروجی APK (قابل دانلود از بخش Artifacts گیت‌هاب)"
        uses: actions/upload-artifact@v4
        with:
          name: FreeInternet-Oblivion-MahsaNG-v6.3.0-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
